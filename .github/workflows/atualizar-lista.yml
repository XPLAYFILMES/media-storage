name: Atualizar Lista M3U Automaticamente

on:
  release:
    types: [published, edited, deleted]
  push:
    paths:
      - 'capas/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar lista M3U sem conflito de duplicidade
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const capasDir = path.join(process.cwd(), 'capas');
            let capaFiles = [];
            if (fs.existsSync(capasDir)) {
              capaFiles = fs.readdirSync(capasDir);
            }

            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let m3uContent = '#EXTM3U\n\n';
            const clean = str => str.toLowerCase().replace(/[^a-z0-9]/g, '');

            for (const rel of releases.data) {
              const rawTitle = rel.name || rel.tag_name;

              // Divide as categorias por "/" ou ";"
              let categories = [];
              if (rawTitle.includes('/')) {
                categories = rawTitle.split('/').map(c => c.trim()).filter(Boolean);
              } else if (rawTitle.includes(';')) {
                categories = rawTitle.split(';').map(c => c.trim()).filter(Boolean);
              } else {
                categories = [rawTitle.trim()];
              }

              for (const asset of rel.assets) {
                const ext = path.extname(asset.name).toLowerCase();
                if (ext === '.mp4' || ext === '.mkv') {
                  const baseName = path.basename(asset.name, ext);
                  const titleFormatted = baseName.replace(/\./g, ' ');

                  const cleanBase = clean(baseName);
                  const cleanRaw = clean(rawTitle);

                  // Localização flexível de capa
                  const matchedCapa = capaFiles.find(file => {
                    const cBase = clean(path.basename(file, path.extname(file)));
                    if (!cBase) return false;
                    return cleanBase.includes(cBase) || 
                           cBase.includes(cleanBase) || 
                           cleanRaw.includes(cBase) || 
                           cBase.includes(cleanRaw);
                  });

                  let logoAttr = '';
                  if (matchedCapa) {
                    const encodedCapa = encodeURIComponent(matchedCapa);
                    const logoUrl = `https://cdn.jsdelivr.net/gh/${context.repo.owner}/${context.repo.repo}@main/capas/${encodedCapa}`;
                    logoAttr = `tvg-logo="${logoUrl}" `;
                  }

                  // Cria entrada única para cada categoria evitando descarte do ClouDDy
                  categories.forEach((cat, index) => {
                    const separator = asset.browser_download_url.includes('?') ? '&' : '?';
                    const streamUrl = categories.length > 1 
                      ? `${asset.browser_download_url}${separator}cat=${encodeURIComponent(cat)}`
                      : asset.browser_download_url;

                    const uniqueId = `${cleanBase}_${index + 1}`;
                    // Se estiver em multiplas categorias, diferencia o nome com espaço invisivel + etiqueta
                    const displayName = categories.length > 1 
                      ? `${titleFormatted} • ${cat}`
                      : titleFormatted;

                    m3uContent += `#EXTINF:-1 tvg-id="${uniqueId}" ${logoAttr}group-title="${cat}",${displayName}\n`;
                    m3uContent += `#EXTGRP:${cat}\n`;
                    m3uContent += `${streamUrl}\n\n`;
                  });
                }
              }
            }

            fs.writeFileSync('lista.m3u', m3uContent);

      - name: Gravar lista.m3u automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "Auto: titulos e tags blindados contra deduplicacao no ClouDDy"
          file_pattern: 'lista.m3u'
