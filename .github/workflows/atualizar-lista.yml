name: Atualizar Lista M3U Automaticamente

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar lista M3U a partir das Releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let m3uContent = '#EXTM3U\n\n';

            for (const rel of releases.data) {
              const groupName = rel.name || rel.tag_name;
              for (const asset of rel.assets) {
                if (asset.name.endsWith('.mp4') || asset.name.endsWith('.mkv')) {
                  const title = asset.name.replace(/\.[^/.]+$/, "").replace(/\./g, " ");
                  m3uContent += `#EXTINF:-1 group-title="${groupName}",${title}\n`;
                  m3uContent += `${asset.browser_download_url}\n\n`;
                }
              }
            }

            fs.writeFileSync('lista.m3u', m3uContent);

      - name: Gravar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: lista.m3u atualizada com novas releases" && git push)
