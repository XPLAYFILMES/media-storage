name: Atualizar Lista M3U Automaticamente

on:
  release:
    types: [published, edited, deleted]
  push:
    paths:
      - 'capas/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Gerar lista M3U inteligente para Séries e Filmes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const capasDir = path.join(process.cwd(), 'capas');
            let capaFiles = [];
            if (fs.existsSync(capasDir)) {
              capaFiles = fs.readdirSync(capasDir);
            }

            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let m3uContent = '#EXTM3U\n\n';

            for (const rel of releases.data) {
              const releaseTitle = rel.name || rel.tag_name;

              for (const asset of rel.assets) {
                const ext = path.extname(asset.name).toLowerCase();
                if (ext === '.mp4' || ext === '.mkv') {
                  const baseName = path.basename(asset.name, ext);
                  
                  // Detecta se é Série pelo padrão S01E01 ou S1E1
                  const seriesMatch = baseName.match(/^(.*?)[._ -]+[Ss](\d{1,2})[Ee](\d{1,2})(?:[._ -]+(.*))?$/i);

                  let groupTitle = releaseTitle;
                  let itemTitle = baseName.replace(/\./g, ' ');
                  let extraTags = '';
                  let capaSearchName = baseName;

                  if (seriesMatch) {
                    const seriesName = seriesMatch[1].replace(/\./g, ' ').trim();
                    const seasonNum = parseInt(seriesMatch[2], 10);
                    const epNum = parseInt(seriesMatch[3], 10);
                    const epExtraTitle = seriesMatch[4] ? ' - ' + seriesMatch[4].replace(/\./g, ' ').trim() : '';

                    groupTitle = seriesName; // Na TV agrupa dentro de "Digimon"
                    itemTitle = `${seriesName} S${String(seasonNum).padStart(2, '0')}E${String(epNum).padStart(2, '0')}${epExtraTitle}`;
                    extraTags = `series-id="${seriesName.toLowerCase().replace(/\s+/g, '-')}" season="${seasonNum}" episode="${epNum}" `;
                    
                    // Permite usar a capa da série inteira (ex: Digimon.jpg) ou a capa do episódio
                    capaSearchName = seriesName;
                  }

                  // Busca capa específica ou capa geral da série
                  const matchedCapa = capaFiles.find(file => {
                    const cBase = path.basename(file, path.extname(file)).toLowerCase();
                    return cBase === baseName.toLowerCase() || cBase === capaSearchName.toLowerCase();
                  });

                  let logoAttr = '';
                  if (matchedCapa) {
                    const encodedCapa = encodeURIComponent(matchedCapa);
                    const logoUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/capas/${encodedCapa}`;
                    logoAttr = `tvg-logo="${logoUrl}" `;
                  }

                  m3uContent += `#EXTINF:-1 ${logoAttr}${extraTags}group-title="${groupTitle}",${itemTitle}\n`;
                  m3uContent += `${asset.browser_download_url}\n\n`;
                }
              }
            }

            fs.writeFileSync('lista.m3u', m3uContent);

      - name: Gravar lista.m3u automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: lista.m3u estruturada para séries e filmes"
          file_pattern: 'lista.m3u'
