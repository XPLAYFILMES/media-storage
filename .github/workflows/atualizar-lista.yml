name: Atualizar Lista M3U Automaticamente

on:
  release:
    types: [published, edited, deleted]
  push:
    paths:
      - 'capas/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar lista M3U com capas e categorias
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const capasDir = path.join(process.cwd(), 'capas');
            let capaFiles = [];
            if (fs.existsSync(capasDir)) {
              capaFiles = fs.readdirSync(capasDir);
            }

            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let m3uContent = '#EXTM3U\n\n';

            for (const rel of releases.data) {
              const groupName = rel.name || rel.tag_name;

              for (const asset of rel.assets) {
                const ext = path.extname(asset.name).toLowerCase();
                if (ext === '.mp4' || ext === '.mkv') {
                  const baseName = path.basename(asset.name, ext);
                  const titleFormatted = baseName.replace(/\./g, ' ');

                  const matchedCapa = capaFiles.find(file => {
                    const cBase = path.basename(file, path.extname(file));
                    return cBase.toLowerCase() === baseName.toLowerCase();
                  });

                  let logoAttr = '';
                  if (matchedCapa) {
                    const encodedCapa = encodeURIComponent(matchedCapa);
                    const logoUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/capas/${encodedCapa}`;
                    logoAttr = `tvg-logo="${logoUrl}" `;
                  }

                  m3uContent += `#EXTINF:-1 ${logoAttr}group-title="${groupName}",${titleFormatted}\n`;
                  m3uContent += `${asset.browser_download_url}\n\n`;
                }
              }
            }

            fs.writeFileSync('lista.m3u', m3uContent);

      - name: Gravar alteracoes no repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lista.m3u
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detetada."
          else
            git commit -m "Auto: lista.m3u atualizada"
            git push origin main
          fi
